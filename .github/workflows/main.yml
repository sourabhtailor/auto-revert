name: CI - SonarCloud Quality Check with Auto Revert

on:
  push:
    branches:
      - dev

concurrency:
  group: revert-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # Required to push revert commit

jobs:
  sonar-quality-check:
    runs-on: ubuntu-latest

    steps:
       # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Get changed files since last push
        id: changed
        run: |
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
            | grep -v '^$' \
            | while read file; do
                if [ -f "$file" ]; then echo "$file"; fi
              done \
            | paste -sd, -)

          echo "FILES=$CHANGED_FILES" >> $GITHUB_ENV
      
       # Step 3: Run SonarCloud scan with quality gate blocking
      - name: SonarCloud Scan (if files changed)
        if: env.FILES != ''
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.projectKey=autodelete-code
            -Dsonar.organization=autodelete-code
            -Dsonar.sources=${{ env.FILES }}
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.host.url=http://101.53.150.196:9000
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Skip SonarCloud Scan (no changes)
        if: env.FILES == ''
        run: echo "No file changes detected. Skipping Sonar scan."
      

