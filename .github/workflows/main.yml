name: CI - SonarCloud Quality Check with Auto Revert

on:
  push:
    branches:
      - dev

concurrency:
  group: revert-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # Required to push revert commit

jobs:
  sonar-quality-check:
    runs-on: ubuntu-latest

    steps:
       # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Get changed PHP/JS files since last push
        id: changed
        run: |
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
            | grep -E '\.(php|js)$' \
            | grep -v '^$' \
            | while read file; do
                if [ -f "$file" ]; then echo "$file"; fi
              done \
            | paste -sd, -)
      
          echo "FILES=$CHANGED_FILES" >> $GITHUB_ENV
      
       # Step 3: Run SonarCloud scan with quality gate blocking
      - name: SonarCloud Scan (if files changed)
        if: env.FILES != ''
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.projectKey=autodelete-code
            -Dsonar.organization=autodelete-code
            -Dsonar.sources=.
            -Dsonar.projectVersion=v1.0.${{ github.run_number }}            
            -Dsonar.inclusions=${{ env.FILES }}
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Skip SonarCloud Scan (no changes)
        if: env.FILES == ''
        run: echo "No file changes detected. Skipping Sonar scan."
      
      - name: Create GitHub Issue on Pipeline or SonarCloud Failure
        if: failure() && env.FILES != ''
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: " CI or SonarCloud Scan Failed"
          content: |
            The CI pipeline or SonarCloud Quality Gate **failed** on branch `${{ github.ref_name }}`.
      
            - **Commit**: `${{ github.sha }}`
            - **Author**: `${{ github.actor }}`
            - **Workflow**: `${{ github.workflow }}`
      
            Please fix the issues as soon as possible.
      
            /cc @your-org/your-team-name
          labels: sonar, ci, failure, alert
            


