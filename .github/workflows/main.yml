name: CI - SonarCloud Quality Check with Report

on:
  push:
    branches:
      - dev

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # Required to push revert commit

jobs:
  sonar-quality-check:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      # Step 2: Get changed PHP/JS files since last push
      - name: Get changed PHP/JS files since last push
        id: changed
        run: |
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
            | grep -E '\.(php|js)$' \
            | grep -v '^$' \
            | while read file; do
                if [ -f "$file" ]; then echo "$file"; fi
              done \
            | paste -sd, -)

          echo "files=$CHANGED_FILES" >> $GITHUB_OUTPUT

      # Step 3: Run SonarCloud Scan (always wait for quality gate)
      - name: SonarCloud Scan
        if: steps.changed.outputs.files != ''
        uses: SonarSource/sonarqube-scan-action@v5
        continue-on-error: true   # <-- don’t fail here, let us capture report
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          FILES: ${{ steps.changed.outputs.files }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=sourabhtailor_devbranch
            -Dsonar.organization=sourabhtailor
            -Dsonar.sources=.
            -Dsonar.projectVersion=v1.0.${{ github.run_number }}
            -Dsonar.inclusions=${{ env.FILES }}
            -Dsonar.qualitygate.wait=true

      # Step 4: Check Quality Gate status
      - name: Check SonarCloud Quality Gate
        if: steps.changed.outputs.files != ''
        id: qualitygate
        run: |
          STATUS=$(curl -s -u "${{ secrets.SONAR_TOKEN }}:" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=sourabhtailor_devbranch&branch=dev" \
            | jq -r '.projectStatus.status')
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "Quality Gate status: $STATUS"

      # Step 5: Generate grouped Sonar Report (if failed)
      - name: Fetch SonarCloud Report
        run: |
          curl -u ${{ secrets.SONAR_TOKEN }}: \
          -o sonar-report.json \
          "https://sonarcloud.io/api/issues/search?componentKeys=sourabhtailor_devbranch&organization=sourabhtailor&resolved=false&ps=500"
        continue-on-error: true # Continue even if the API call fails

      - name: Upload Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonarcloud-report
          path: sonar-report.json
