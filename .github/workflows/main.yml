name: CI - SonarCloud Quality Check with Auto Revert

on:
  push:
    branches:
      - dev

concurrency:
  group: revert-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # Required to push revert commit

jobs:
  sonar-quality-check:
    runs-on: ubuntu-latest

    steps:
       # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      # Step 1: Get changed PHP/JS files since last push
      - name: Get changed PHP/JS files since last push
        id: changed
        run: |
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
            | grep -E '\.(php|js)$' \
            | grep -v '^$' \
            | while read file; do
                if [ -f "$file" ]; then echo "$file"; fi
              done \
            | paste -sd, -)
      
          echo "files=$CHANGED_FILES" >> $GITHUB_OUTPUT
      
      # Step 2: Run SonarCloud scan with quality gate blocking (only if files changed)
      - name: SonarCloud Scan (if files changed)
        if: steps.changed.outputs.files != ''
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          FILES: ${{ steps.changed.outputs.files }}
        with:
          args: >
            -Dsonar.projectKey=sourabhtailor_autodelete-code
            -Dsonar.organization=sourabhtailor
            -Dsonar.sources=.
            -Dsonar.projectVersion=v1.0.${{ github.run_number }}
            -Dsonar.inclusions=${{ env.FILES }}
            -Dsonar.qualitygate.wait=true
          
      - name: Skip SonarCloud Scan (no changes)
        if: steps.changed.outputs.files == ''
        run: echo "No php or js file changes detected. Skipping Sonar scan."

      

