name: CI - SonarCloud Quality Check with Auto Revert

on:
  push:
    branches:
      - dev

concurrency:
  group: revert-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # Required to push revert commit

jobs:
  sonar-quality-check:
    runs-on: ubuntu-latest

    steps:
       # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Get changed files since last push
        run: |
                 echo "FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | paste -sd, -)" >> $GITHUB_ENV
      
       # Step 3: Run SonarCloud scan with quality gate blocking
      - name: Run SonarScanner on changed files
        run: |
          if [ -n "${FILES}" ]; then
            echo "Scanning only changed files: ${FILES}"
            sonar-scanner \
              -Dsonar.projectKey=my_project_key \
              -Dsonar.sources=. \
              -Dsonar.inclusions="${FILES}" \
              -Dsonar.login=${{ secrets.SONAR_TOKEN }}
          else
            echo "No files changed. Skipping scan."
          fi
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

